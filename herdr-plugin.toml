id = "herdr.agent-messenger"
name = "HAM"
version = "0.9.1"
min_herdr_version = "0.8.0"
description = "Label Herdr agents and coordinate prompts with HAM, the Herdr Agent Messenger."
platforms = ["macos", "linux"]

[[actions]]
id = "mailbox-split"
title = "HAM: Mailbox (Right Split)"
description = "Inspect agents, mailbox threads and repository settings, or send a quick FYI."
contexts = ["workspace", "pane"]
command = ["python3", "-m", "ham", "mailbox", "split"]

[[actions]]
id = "mailbox-tab"
title = "HAM: Mailbox (Tab)"
description = "Open the workspace's HAM mailbox in a plugin-owned tab."
contexts = ["workspace", "pane"]
command = ["python3", "-m", "ham", "mailbox", "tab"]

[[actions]]
id = "mailbox-popup"
title = "HAM Mailbox (quick send)"
description = "Quick-send a user FYI from an overlay that closes after a successful send."
contexts = ["workspace", "pane"]
command = ["python3", "-m", "ham", "mailbox", "overlay"]

[[actions]]
id = "fyi-now"
title = "HAM: Deliver queued FYI now"
description = "Deliver the focused agent's queued FYI now instead of after the FYI delay; no prompt, no model tokens."
contexts = ["pane"]
command = ["python3", "-m", "ham", "mailbox", "fyi-now"]

[[actions]]
id = "label-current"
title = "Assign Agent Label"
description = "Assign a color-animal name to the agent in the focused pane."
contexts = ["pane"]
command = ["python3", "-m", "ham", "labels", "label"]

[[actions]]
id = "message-agents"
title = "HAM: Send Prompt to Agents"
description = "Select agents, then delegate through the coordinator or send directly."
contexts = ["pane"]
command = ["python3", "-m", "ham", "messenger", "launch"]

[[actions]]
id = "held-messages"
title = "HAM: Held Messages"
description = "Push or cancel messages held while their recipient was focused."
contexts = ["workspace", "pane"]
command = ["python3", "-m", "ham", "messenger", "held-launch"]

[[actions]]
id = "agent-skill-guide"
title = "HAM Skill"
description = "Install, update, or learn how to use HAM."
contexts = ["workspace", "pane"]
command = ["python3", "-m", "ham", "skill-installer", "launch"]

[[startup]]
command = ["python3", "-m", "ham", "labels", "reconcile"]

[[startup]]
command = ["python3", "-m", "ham", "delivery", "reconcile"]

[[startup]]
command = ["python3", "-m", "ham", "cli", "ledger", "reconcile"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-m", "ham", "labels", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-m", "ham", "labels", "event"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-m", "ham", "cli", "ledger", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-m", "ham", "cli", "ledger", "event"]

[[panes]]
id = "messenger"
title = "HAM"
placement = "overlay"
command = ["python3", "-m", "ham", "messenger", "overlay"]

[[panes]]
id = "skill-installer"
title = "HAM Skill"
placement = "overlay"
command = ["python3", "-m", "ham", "skill-installer", "overlay"]

[[panes]]
id = "held"
title = "HAM: Held Messages"
placement = "overlay"
command = ["python3", "-m", "ham", "messenger", "overlay-held"]

[[panes]]
id = "mailbox"
title = "HAM Mailbox"
placement = "split"
command = ["python3", "-m", "ham", "mailbox", "pane"]

[[panes]]
id = "mailbox-popup"
title = "HAM Mailbox (quick send)"
placement = "overlay"
command = ["python3", "-m", "ham", "mailbox", "overlay-pane"]
